<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Etiquetas de Patrimônio - SENAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; margin: 0; padding: 0; }
            .etiqueta { break-inside: avoid; }
        }
        .etiqueta {
            width: 5.5cm;
            height: 6.5cm;
            border: 2px dashed #CBD5E1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: white;
            border-radius: 10px;
            padding: 10px;
            page-break-inside: avoid;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-8 text-slate-800 font-sans">

    <div class="max-w-4xl mx-auto no-print bg-white p-6 rounded-2xl shadow-sm mb-8 border border-slate-200 space-y-5">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-xl font-black text-slate-900 tracking-tight">Gerador de Etiquetas de Patrimônio</h1>
                <p class="text-xs text-slate-500 mt-0.5">Imprima etiquetas com QR Code para colar nos monitores dos computadores</p>
            </div>
            <span class="text-xs font-bold text-red-600 bg-red-50 border border-red-200 px-3 py-1 rounded-full uppercase">SENAI-SP</span>
        </div>

        <!-- Modo de Registro -->
        <div class="bg-blue-50/80 border border-blue-200 rounded-xl p-4 flex items-center gap-3">
            <input type="checkbox" id="modo-pc" checked onchange="gerarEtiquetas()" class="w-4 h-4 accent-red-600 cursor-pointer">
            <div class="flex-1">
                <label for="modo-pc" class="font-bold text-slate-800 text-sm cursor-pointer">Auto-registro por Celular (Modo URL Ativo)</label>
                <p class="text-xs text-slate-500 mt-0.5">O QR Code vira o link que o aluno aponta a câmera para registrar o nome diretamente</p>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 items-end">
            <div class="col-span-2">
                <label class="text-xs font-bold uppercase text-slate-600 mb-1 block">IP do computador servidor na rede</label>
                <input type="text" id="server-ip" placeholder="ex: 192.168.1.25"
                    oninput="gerarEtiquetas()"
                    class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-mono font-bold">
                <p id="qr-host-help" class="text-xs text-amber-700 mt-1">No celular, use o IP de rede deste computador. “localhost” só funciona no próprio computador.</p>
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-slate-600 mb-1 block">Prefixo</label>
                <input type="text" id="prefixo" value="PC-" oninput="gerarEtiquetas()" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold">
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-slate-600 mb-1 block">Descrição</label>
                <input type="text" id="descricao" value="Computador Lab" placeholder="Opcional" oninput="gerarEtiquetas()" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4 items-end pt-2">
            <div>
                <label class="text-xs font-bold uppercase text-slate-600 mb-1 block">Do Número</label>
                <input type="number" id="num_inicio" value="1" min="1" oninput="gerarEtiquetas()" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold">
            </div>
            <div>
                <label class="text-xs font-bold uppercase text-slate-600 mb-1 block">Até o Número</label>
                <input type="number" id="num_fim" value="15" min="1" oninput="gerarEtiquetas()" class="w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm font-bold">
            </div>
            <button onclick="window.print()" class="bg-red-600 hover:bg-red-700 text-white font-black py-3 px-6 rounded-xl text-sm transition-colors shadow">
                Imprimir Folha A4
            </button>
        </div>
    </div>

    <!-- Área de Impressão -->
    <div id="area-impressao" class="max-w-4xl mx-auto bg-white p-8 shadow-sm rounded-2xl flex flex-wrap gap-4 justify-start"></div>

    <script>
        const pageHost = window.location.hostname;
        const serverInput = document.getElementById('server-ip');
        const hostHelp = document.getElementById('qr-host-help');
        // Reuse the host used to open this page when it is a LAN address.
        // A localhost URL cannot be reached from another device, so require a LAN IP.
        if (pageHost && pageHost !== 'localhost' && pageHost !== '127.0.0.1') {
            serverInput.value = pageHost;
            hostHelp.textContent = `Os links usarão este endereço na porta 5000: ${pageHost}:5000`;
            hostHelp.classList.remove('text-amber-700');
            hostHelp.classList.add('text-emerald-700');
        }

        function gerarEtiquetas() {
            const prefixo   = document.getElementById('prefixo').value.trim();
            const inicio    = parseInt(document.getElementById('num_inicio').value) || 1;
            const fim       = parseInt(document.getElementById('num_fim').value) || 1;
            const descricao = document.getElementById('descricao').value.trim();
            const isPC      = document.getElementById('modo-pc').checked;
            const serverIP  = serverInput.value.trim().replace(/^https?:\/\//i, '').replace(/:\d+$/, '').replace(/\/$/, '');
            const container = document.getElementById('area-impressao');
            container.innerHTML = '';

            for (let i = inicio; i <= fim; i++) {
                const num = i.toString().padStart(2, '0');
                const id  = `${prefixo}${num}`;
                // Porta 5000
                const qrContent = isPC ? `${window.location.protocol === 'https:' ? 'https:' : 'http:'}//${serverIP || 'SEU-IP-NA-REDE'}:5000/retirar/${id}` : id;

                const div = document.createElement('div');
                div.className = 'etiqueta';
                div.innerHTML = `
                    <img src="assets/img/logo-senai.png" class="h-5 mb-2 opacity-80 grayscale" alt="SENAI">
                    <div id="qr-${i}" class="my-1"></div>
                    <p class="font-black text-lg tracking-widest text-slate-900 mt-1">${id}</p>
                    ${descricao ? `<p class="text-[9px] text-slate-500 mt-0.5 leading-tight">${descricao}</p>` : ''}
                    ${isPC ? `<p class="text-[8px] text-blue-600 mt-0.5 font-bold uppercase tracking-wider">📱 Aponte a Câmera</p>` : ''}
                    <p class="text-[8px] text-slate-400 mt-1 uppercase tracking-wider font-bold">SENAI Patrimônio</p>
                `;
                container.appendChild(div);

                new QRCode(document.getElementById(`qr-${i}`), {
                    text: qrContent,
                    width: 105,
                    height: 105,
                    colorDark: "#0f172a",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.M
                });
            }
        }
        gerarEtiquetas();
    </script>
</body>
</html>
